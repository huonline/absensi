<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Absensi Kobong</title>
    
    <link rel="icon" type="image/jpeg" href="LOGO%20HU%20NEW.jpg">
    <link rel="apple-touch-icon" href="LOGO%20HU%20NEW.jpg">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- HEADER KOBONG -->
        <header class="header">
            <h1 id="nama-kobong">Memuat Data...</h1>
            <p style="background: #e8f5e9; padding: 10px; border-radius: 6px; display: inline-block; border: 1px solid #c8e6c9;">
                <span id="detail-pengurus">Memeriksa database...</span>
            </p>
        </header>

        <!-- FORM ABSENSI -->
        <section class="admin-section">
            <form id="form-absensi">
                
                <!-- PILIHAN WAKTU (Sudah dikunci hanya Malam/Tidur) -->
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="waktu"><strong>Waktu Absensi:</strong></label>
                    <select id="waktu" name="waktu" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; margin-top: 5px;">
                        <option value="Subuh" disabled style="color: #ccc;">🌅 Subuh </option>
                        <option value="Zuhur" disabled style="color: #ccc;">☀️ Zuhur </option>
                        <option value="Ashar" disabled style="color: #ccc;">🌤️ Ashar </option>
                        <option value="Maghrib" disabled style="color: #ccc;">🌆 Maghrib </option>
                        <option value="Isya" disabled style="color: #ccc;">🌙 Isya </option>
                        <option value="Malam" selected style="font-weight: bold; color: #2e7d32;">🛌 Malam / Tidur</option>
                    </select>
                </div>

                <!-- NAMA PELAPOR -->
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="nama-pelapor"><strong>Nama Pengurus (Pelapor):</strong></label>
                    <input type="text" id="nama-pelapor" placeholder="Masukkan nama Anda..." required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; margin-top: 5px;">
                </div>

                <!-- DAFTAR CEKLIS SANTRI (Auto Generate dari JS) -->
                <div class="form-group" style="margin-bottom: 15px; border-top: 2px dashed #eee; padding-top: 15px;">
                    <label><strong id="total-anggota" style="font-size: 1.1rem; color: #1b5e20;">Anggota Santri:</strong></label>
                    
                    <div id="container-ceklis-santri" style="margin-top: 15px; display: flex; flex-direction: column; gap: 12px;">
                        <p style="color: #888;">Memuat daftar santri...</p>
                    </div>
                </div>

                <!-- CATATAN TAMBAHAN -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="catatan"><strong>Catatan Tambahan (Opsional):</strong></label>
                    <textarea id="catatan" rows="3" placeholder="Tulis alasan jika ada santri yang Sakit / Izin / Alfa..." style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; margin-top: 5px;"></textarea>
                </div>

                <!-- TOMBOL KIRIM -->
                <button type="submit" style="width: 100%; padding: 14px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    Kirim Laporan
                </button>
            </form>
        </section>

        <hr class="divider">

        <!-- RIWAYAT ABSENSI KOBONG -->
        <section class="admin-section">
            <h2>Riwayat Laporan Kobong Ini</h2>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Kobong</th>
                            <th>Pelapor</th>
                            <th>Catatan</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-riwayat-kobong">
                        <tr>
                            <td colspan="5" class="text-center">Memuat riwayat absen...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- PANGGIL SCRIPT UTAMA -->
    <script type="module" src="script.js"></script>
</body>
</html>
