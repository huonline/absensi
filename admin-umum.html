<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Monitoring Absensi</title>
    
    <link rel="icon" type="image/jpeg" href="LOGO%20HU%20NEW.jpg">
    <link rel="apple-touch-icon" href="LOGO%20HU%20NEW.jpg">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSS KHUSUS CETAK/PRINT & FILTER -->
    <style>
        @media print {
            .btn-nav, .filter-box, .btn-action-group, header p {
                display: none !important;
            }
            .container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
            }
            body {
                background: #fff !important;
                color: #000 !important;
            }
            .admin-section {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
            }
        }
        .btn-action-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .btn-print {
            flex: 1;
            background: #1565c0;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-copy {
            flex: 1;
            background: #2e7d32;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-print:hover { background: #0d47a1; }
        .btn-copy:hover { background: #1b5e20; }

        /* DESAIN AREA FILTER BARU */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .filter-item label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #2e7d32;
        }
        .filter-item input, .filter-item select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            outline: none;
        }
        .filter-item input:focus, .filter-item select:focus {
            border-color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container container-large">
        <header class="header">
            <h1>Dashboard Super Admin</h1>
            <p>Pusat Monitoring & Grafik Persentase Absensi Santri (35 Kobong)</p>
            
            <div style="margin-top: 12px;">
                <a href="data-santri.html" class="btn-nav" style="display: inline-block; width: 100%; text-align: center; box-sizing: border-box; padding: 10px;">
                    Kelola Data Santri &rarr;
                </a>
            </div>
        </header>

        <!-- SEKSI 1: GRAFIK PERSENTASE -->
        <section class="admin-section">
            <h2>Persentase Kehadiran</h2>
            <div class="chart-box">
                <canvas id="grafikKehadiran"></canvas>
            </div>
        </section>

        <hr class="divider">

        <!-- SEKSI 2: LAPORAN MASUK -->
        <section class="admin-section">
            <h2>Laporan Masuk</h2>

            <!-- TOMBOL CETAK & SALIN REKAP -->
            <div class="btn-action-group">
                <button onclick="window.print()" class="btn-print">🖨️ Cetak / Simpan PDF</button>
                <button onclick="salinRekapTeks()" class="btn-copy">📋 Salin Ringkasan WA</button>
            </div>

            <!-- AREA FILTER TERPADU (KOBONG, TANGGAL, & CARI TEKS) -->
            <div class="filter-box">
                <div class="filter-grid">
                    <!-- 1. Filter Kobong -->
                    <div class="filter-item">
                        <label for="filter-kobong">Filter Kobong:</label>
                        <select id="filter-kobong">
                            <option value="ALL">-- Semua Kobong --</option>
                        </select>
                    </div>

                    <!-- 2. Filter Tanggal -->
                    <div class="filter-item">
                        <label for="filter-tanggal">Filter Tanggal:</label>
                        <div style="display: flex; gap: 6px;">
                            <input type="date" id="filter-tanggal" style="flex: 1;">
                            <button type="button" id="btn-reset-tanggal" style="background: #757575; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;">Reset</button>
                        </div>
                    </div>

                    <!-- 3. Cari Pelapor / Catatan -->
                    <div class="filter-item">
                        <label for="cari-teks">Pancarian Teks / Catatan:</label>
                        <input type="text" id="cari-teks" placeholder="Ketik nama pelapor / kata kunci...">
                    </div>
                </div>
            </div>

            <!-- TABEL LAPORAN -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Kobong</th>
                            <th>Pelapor</th>
                            <th>Laporan</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-laporan">
                        <tr>
                            <td colspan="5" class="text-center">Memuat data laporan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
